  @media (max-width:760px) { .two { grid-template-columns:1fr; } .srow { grid-template-columns:1fr; } }

  .csq.q { border-style:dashed; border-color:var(--warn); color:var(--warn); }

  .advs label { display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 8px; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .pk input[type=text] { flex-basis:100%; }
  .redbox { border:2px solid var(--bad); border-radius:6px; padding:6px 10px; color:var(--bad); background:var(--bad-soft); font-size:var(--fs-sm); margin-top:6px; }
  .pickgrid { display:block; } .pickside { margin-top:12px; }
  @media (min-width:900px) { .pickgrid { display:grid; grid-template-columns:minmax(0, 2fr) minmax(0, 1fr); gap:12px; align-items:start; } .pickside { margin-top:0; position:sticky; top:8px; } }
</style>

function detailText(x) {
  if (Array.isArray(x)) { const t = x.map(detailText).filter(Boolean); return t.length > 4 ? t.slice(0, 4).join('、') + `…等共 ${t.length} 項（完整清單看下面的卡片）` : t.join('、'); }
  if (x && typeof x === 'object') return x.kind === 'no_term' ? gapText(x) : x.note || x.kind || '';

  if (/externalUrl/.test(k)) return '連結要 https:// 開頭'; if (/LessonSession_title|"title"/.test(k)) return '課名要 1～100 字'; if (/format/.test(k)) return '形式不對';

const errText = (d) => (ERRS[d.error] || '這個動作沒做成，請再按一次。還是不行，請把畫面截圖給育才仕行政。') + (d.error === 'VALIDATION' && d.detail != null ? '：' + detailText(d.detail) : '');
let toastTimer = 0;

// 2026-11-12 楊老師試用回饋 階段 0②（OUTPUTS/nopq_yang_feedback_revision_v0.1.md 第四節 (b) 第 9–11 項）：每次跟資料庫要資料都有等待上限；
// 失敗時把畫面上的「載入中」換成一句話＋重新載入鈕（不再一直轉）；轉超過 6 秒加一句「還在讀」。同學生頁 core.js 的做法。
const RPC_LIMIT = 25000;
let RT = 0, lastFailMsg = '';   // 換頁計數：慢回應不蓋掉新頁；最近一次失敗的原因

async function call(fn, args, opts = {}) {
  const my = RT, { data, error, late } = await rpcLimited(fn, args);

const failCard = (msg) => `<div class="card"><h2>這一頁沒有載入</h2><p class="muted">${esc(msg)}</p><button type="button" class="btn" data-act="reloadView">重新載入</button></div>`;

const ldSeen = new WeakMap();

// ── 登入／開機／路由 ──

  if (ask && ask.kind === 'done') panel = `<div class="hint"><div>確定 ${esc(b.studentNickname)} 這堂已經上完？按了會扣 ${b.hours} 小時。</div><label class="f" for="a-min">實際花了幾分鐘（選填）</label><input type="text" inputmode="numeric" id="a-min" data-in="ask" data-k="min" maxlength="4" value="${esc(ask.min || '')}"><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-act="doneGo">確定已完成</button><button type="button" class="btn sm ghost" data-act="askNo">先不要</button></div></div>`;
  if (ask && ask.kind === 'cancel') panel = `<div class="hint"><div>取消 ${esc(b.studentNickname)} 這堂？學生的時數不扣，這段時段會一起收回。</div><label class="f" for="a-why">原因（選填，學生看得到）</label><input type="text" id="a-why" data-in="ask" data-k="why" maxlength="200" value="${esc(ask.why || '')}"><div class="row" style="margin-top:8px"><button type="button" class="btn sm warn" data-act="tcGo">確定取消</button><button type="button" class="btn sm ghost" data-act="askNo">先不要</button></div></div>`;
  return `<div class="tslot" data-slot="${esc(s.id)}" style="padding:8px 0;border-top:1px solid var(--line)"><div class="row spread"><span><b>${esc(dayTime(s.startsAt))}–${esc(hm(s.endsAt))}</b> <span class="pill">${s.hours} 小時</span></span><span class="row">${st}${btns}</span></div>${s.note ? `<div class="muted small">上課方式：${esc(s.note)}</div>` : ''}${panel}</div>`;
}
IN.sf = (el) => { S.ui.sf[el.dataset.k] = el.value; };
IN.ask = (el) => { if (S.ui.ask) S.ui.ask[el.dataset.k] = el.value; };
ACT.askNo = () => { S.ui.ask = null; renderLessons(); };
ACT.doneAsk = (el) => { S.ui.ask = { kind: 'done', id: el.dataset.id, min: '' }; renderLessons(); };
ACT.tcAsk = (el) => { S.ui.ask = { kind: 'cancel', id: el.dataset.id, why: '' }; renderLessons(); };
ACT.addSlot = async (el) => {
  const g = S.ui.sf, at = g.at ? new Date(g.at) : null;
  if (!at || isNaN(at)) return toast('開始時間要選。', true);
  if (at.getTime() <= Date.now()) return toast(LERR.SLOT_IN_PAST, true);
  el.disabled = true;
  const r = await call('teacher_add_tutor_slot', { p: { startsAt: at.toISOString(), hours: Number(g.hours) || 1, repeatWeeks: Number(g.rep) || 0, note: g.note.trim() } }, { quiet: true });
  el.disabled = false;
  if (!r.ok) return toast(lerr(r), true);
  const sk = r.skipped || [];
  toast(`已開 ${r.created.length} 段。` + (sk.length ? `另有 ${sk.length} 段沒開：` + sk.map((x) => `${dayTime(x.startsAt)}（${SKIP_WHY[x.reason] || x.reason}）`).join('、') : ''), sk.length > 0);
  S.ui.sf = { at: '', hours: g.hours, rep: '0', note: g.note }; viewLessons();
};
ACT.closeSlot = async (el) => {
  el.disabled = true; const r = await call('teacher_close_tutor_slot', { p_slot_id: el.dataset.id }, { quiet: true }); el.disabled = false;
  if (!r.ok) { toast(lerr(r), true); return viewLessons(); }
  toast('已收回這段。'); viewLessons();
};
ACT.doneGo = async (el) => {
  const a = S.ui.ask; if (!a) return; const m = String(a.min || '').trim();
  if (m && !/^\d{1,4}$/.test(m)) return toast('分鐘數只能填數字。', true);
  el.disabled = true; const r = await call('teacher_complete_booking', { p_booking_id: a.id, p: { minutesSpent: m } }, { quiet: true }); el.disabled = false;
  if (!r.ok) { toast(lerr(r), true); if (r.error !== 'QUOTA_EXHAUSTED') viewLessons(); return; }
  toast(`已完成，扣了 ${r.booking.hours} 小時。這位學生還有 ${r.hours.remaining} 小時。`); viewLessons();
};
ACT.tcGo = async (el) => {
  const a = S.ui.ask; if (!a) return;
  el.disabled = true; const r = await call('teacher_cancel_booking', { p_booking_id: a.id, p: { reason: String(a.why || '').trim() } }, { quiet: true }); el.disabled = false;
  if (!r.ok) { toast(lerr(r), true); return viewLessons(); }
  toast('已取消這堂，時段一起收回。'); viewLessons();
};
// ── 補充用語 ──
function viewTerms() {
  const f = S.ui.tf = S.ui.tf || { term: '', dept: '' };
  view(`<div class="card"><h2>補充能力用語</h2><p class="muted" style="margin:0 0 6px">系統建議能力標籤時，只會用這三種來源的詞：校系指引、學群通用、老師補充。你補的詞只有你帶的學生會用到。</p>
    <label class="f" for="t-term">用語（必填，最多 30 字）</label><input type="text" id="t-term" data-in="tf" data-k="term" maxlength="30" value="${esc(f.term)}">
    <label class="f" for="t-dept">對應校系代碼（選填）</label><input type="text" id="t-dept" data-in="tf" data-k="dept" maxlength="20" value="${esc(f.dept)}">
    <div style="margin-top:12px"><button class="btn" data-act="addTerm">加入</button></div></div>
    <div class="card"><h3 style="margin-top:0">這次登入加的用語（${S.terms.length}）</h3>${S.terms.map((t) => `<div style="padding:3px 0"><b>${esc(t.term)}</b> ${t.dept ? `<span class="pill">${esc(t.dept)}</span>` : ''}<span class="muted small">編號 ${esc(t.id)}</span></div>`).join('') || '<span class="muted">還沒有。</span>'}</div>`);
}
IN.tf = (el) => { S.ui.tf[el.dataset.k] = el.value; };
ACT.addTerm = async (el) => {
  const f = S.ui.tf; if (!f.term.trim()) return toast('用語要寫。', true); el.disabled = true;
  const r = await call('teacher_add_term', { p_term: f.term.trim(), p_dept_code: f.dept.trim() }); el.disabled = false; if (!r.ok) return;
  S.terms.unshift({ term: f.term.trim(), dept: f.dept.trim(), id: r.termId }); S.ui.tf = null; toast('已加入用語。'); viewTerms();
};
window.addEventListener('beforeunload', (e) => { if (S.ui && S.ui.editKey && S.ui.editText) { e.preventDefault(); e.returnValue = ''; } });
sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT' && S.home) showLogin('已登出。'); });
(async function boot() { const { data } = await sb.auth.getSession(); if (data && data.session) await enter(); else showLogin(''); })();
</script>
</body>
</html>
