  button.pill { font-family:inherit; cursor:pointer; }
  input[type=text], input[type=email], input[type=password], input[type=datetime-local], textarea, select { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); }

  .seg { margin:12px 0 4px; padding:5px 10px; border-left:4px solid var(--main); background:var(--soft); font-weight:700; border-radius:0 6px 6px 0; }

  .badge { display:inline-block; font-size:12px; padding:0 8px; border-radius:4px; background:#EEF1F5; color:var(--muted); border:1px solid var(--line); } .badge.ai { background:#FFF8EC; color:var(--warn); border-color:#F0D9A8; }
  .seg-tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; } ul.plain { margin:4px 0; padding-left:20px; } .center { text-align:center; padding:30px 0; }
  .login { max-width:380px; margin:8vh auto 0; padding:0 14px; } .login h1 { font-size:22px; color:var(--main); margin:0 0 4px; } .err { color:var(--bad); font-size:14px; margin-top:8px; }
  @media (max-width:760px) { .two { grid-template-columns:1fr; } .srow { grid-template-columns:1fr; } }
  .lvbox { margin-top:6px; } .lvpanel { background:var(--soft); border-radius:6px; padding:6px 10px 10px; } .lvpanel h3 { font-size:14px; margin:10px 0 4px; }   /* 2026-11-09 落點分析版本 */
</style>

<body>
<div id="boot" class="center muted"><span class="spin"></span>載入中…</div>

<script>

  CASE_NOT_FOUND: '找不到這一篇。', NOT_ASSIGNED: '這位學生不是你帶的，看不到也不能動。', CONSENT_MISSING: '這位學生的同意書還沒登錄完成。',
  AI_CONSENT_MISSING: '這位學生沒有 AI 處理同意。', STATE_INVALID: '現在這一步不能這樣做，已為你更新畫面。', STALE: '畫面已過期（學生或別處剛更新過），已為你重新載入，請再操作一次。',
  QUOTA_EXCEEDED: '這位學生今天的系統次數用完了。', VALIDATION: '資料不完整或格式不對', AI_OFF: '目前沒有開 AI，這一步由你接手。',
};

  quote: '選取的文字不在這一欄裡（請在同一欄內重新框選）', issue: '意見不可空白', items: '意見清單格式不對', decision: '決定沒選', summary: '退回與重開要寫總評', term: '用語不可空白（最多 30 字）' };
function detailText(x) {
  if (Array.isArray(x)) { const t = x.map(detailText).filter(Boolean); return t.length > 4 ? t.slice(0, 4).join('、') + `…等共 ${t.length} 項（完整清單看下面的卡片）` : t.join('、'); }
  if (x && typeof x === 'object') return x.kind === 'no_term' ? gapText(x) : x.note || x.kind || '';
  const k = String(x).split(':')[0];
  if (/externalUrl/.test(k)) return '連結要 https:// 開頭'; if (/LessonSession_title|"title"/.test(k)) return '課名要 1～100 字'; if (/format/.test(k)) return '形式不對';
  return FIELD_NAMES[k] || (/violates|constraint|relation/.test(k) ? '格式不符規則' : String(x));
}
const errText = (d) => (ERRS[d.error] || `這一步沒有成功（${d.error}）`) + (d.error === 'VALIDATION' && d.detail != null ? '：' + detailText(d.detail) : '');
let toastTimer = 0;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 4500); }
// 2026-11-12 楊老師試用回饋 階段 0②（OUTPUTS/nopq_yang_feedback_revision_v0.1.md 第四節 (b) 第 9–11 項）：每次跟資料庫要資料都有等待上限；
// 失敗時把畫面上的「載入中」換成一句話＋重新載入鈕（不再一直轉）；轉超過 6 秒加一句「還在讀」。同學生頁 core.js 的做法。
const RPC_LIMIT = 25000;
let RT = 0, lastFailMsg = '';   // 換頁計數：慢回應不蓋掉新頁；最近一次失敗的原因
async function rpcLimited(fn, args) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null; let timer = 0, late = false;
  const limit = new Promise((res) => { timer = setTimeout(() => { late = true; if (ctl) ctl.abort(); res({ data: null, error: { message: 'TIMEOUT' } }); }, RPC_LIMIT); });
  let b = sb.rpc(fn, args || {}); if (ctl && b && typeof b.abortSignal === 'function') b = b.abortSignal(ctl.signal);
  try { const r = await Promise.race([b, limit]); return late ? { data: null, error: { message: 'TIMEOUT' }, late: true } : r; } finally { clearTimeout(timer); }

async function call(fn, args, opts = {}) {
  const my = RT, { data, error, late } = await rpcLimited(fn, args);
  if (error) {
    if (error.status === 401 || error.code === 'PGRST301' || /JWT|expired/i.test(error.message || '')) { await toLogin('登入已過期，請重新登入。'); throw new Error('AUTH'); }
    if (error.status === 403 || error.code === '42501') { toast('這個帳號沒有權限做這件事。', true); throw new Error('DENIED'); }

}
const failCard = (msg) => `<div class="card"><h2>這一頁沒有載入</h2><p class="muted">${esc(msg)}</p><button type="button" class="btn" data-act="reloadView">重新載入</button></div>`;
function loadFail(msg, my) { setTimeout(() => { if (my !== RT) return; document.querySelectorAll('#view [data-loading]').forEach((el) => { el.outerHTML = failCard(msg); }); }, 0); }
const ldSeen = new WeakMap();
setInterval(() => {
  document.querySelectorAll('#view [data-loading]').forEach((el) => {
    if (!ldSeen.has(el)) ldSeen.set(el, Date.now());
    const age = Date.now() - ldSeen.get(el), slow = el.querySelector('.ld-slow');
    if (age > 6000 && slow) slow.classList.remove('hidden');
    if (age > RPC_LIMIT + 10000) el.outerHTML = failCard('等太久沒有回應，請檢查網路再按「重新載入」。');
  });
}, 1000);

  const el = ev.target.closest('[data-act]'); if (!el || el.disabled || !ACT[el.dataset.act]) return;

});
document.addEventListener('input', (ev) => { const el = ev.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, ev); });

const show = (id, on) => $(id).classList.toggle('hidden', !on);

  $('l-err').textContent = msg || ''; show('l-err', !!msg); $('l-btn').disabled = false;
}

ACT.logout = async () => { await toLogin(''); };

  $('boot').innerHTML = '<div class="card" style="max-width:440px;margin:40px auto;text-align:left"><h2>連不上系統</h2><p class="muted">可能是網路斷了，或系統暫時休息中。請檢查網路，再按「再試一次」。</p><div class="row"><button type="button" class="btn" data-act="bootRetry">再試一次</button><button type="button" class="btn ghost" data-act="logout">回登入頁</button></div></div>';

    <div style="margin-top:12px"><button class="btn" data-act="addTerm">加入</button></div></div>
    <div class="card"><h3 style="margin-top:0">這次登入加的用語（${S.terms.length}）</h3>${S.terms.map((t) => `<div style="padding:3px 0"><b>${esc(t.term)}</b> ${t.dept ? `<span class="pill">${esc(t.dept)}</span>` : ''}<span class="muted small">編號 ${esc(t.id)}</span></div>`).join('') || '<span class="muted">還沒有。</span>'}</div>`);
}
IN.tf = (el) => { S.ui.tf[el.dataset.k] = el.value; };
ACT.addTerm = async (el) => {
  const f = S.ui.tf; if (!f.term.trim()) return toast('用語要寫。', true); el.disabled = true;
  const r = await call('teacher_add_term', { p_term: f.term.trim(), p_dept_code: f.dept.trim() }); el.disabled = false; if (!r.ok) return;
  S.terms.unshift({ term: f.term.trim(), dept: f.dept.trim(), id: r.termId }); S.ui.tf = null; toast('已加入用語。'); viewTerms();
};
window.addEventListener('beforeunload', (e) => { if (S.ui && S.ui.editKey && S.ui.editText) { e.preventDefault(); e.returnValue = ''; } });
sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT' && S.home) showLogin('已登出。'); });
(async function boot() { const { data } = await sb.auth.getSession(); if (data && data.session) await enter(); else showLogin(''); })();
</script>
</body>
</html>
