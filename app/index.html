<div id="boot" class="center muted"><span class="spin"></span>載入中…</div>
<div id="login" class="login hidden">
  <h1>NOPQ通</h1>
  <p class="muted" style="margin:0 0 14px">育才仕備審輔導｜學生登入</p>
  <div id="l-import" class="hint hidden" style="margin:0 0 12px"></div>
  <form id="login-form" class="card" autocomplete="on">
    <label class="f" for="l-email">Email</label><input type="email" id="l-email" autocomplete="username" required>
    <label class="f" for="l-pw">密碼</label><input type="password" id="l-pw" autocomplete="current-password" required>
    <div id="l-err" class="err hidden"></div>
    <div style="margin-top:14px"><button class="btn" type="submit" id="l-btn" style="width:100%">登入</button></div>
    <div style="margin-top:8px"><button class="btn ghost" type="button" id="l-forgot" data-act="forgotOpen" style="width:100%">忘記密碼</button></div>
    <p class="muted small" style="margin:12px 0 0">老師請到 <a href="../teacher/">老師頁</a>。</p>
  </form>
  <!-- 2026-11-25 第 ① 步：忘記密碼（寄重設信）。不用新網址，登入頁裡切換顯示；兩張都由 acct.js 的 loginPane 切 -->
  <form id="forgot-form" class="card hidden" autocomplete="on" novalidate>
    <p class="muted" style="margin:0 0 4px">填你註冊的 Email，我們寄一封信給你，信裡有設新密碼的連結。</p>
    <label class="f" for="f-email">Email</label><input type="email" id="f-email" autocomplete="username">
    <div id="f-err" class="err hidden" role="alert"></div>
    <div style="margin-top:14px"><button class="btn" type="submit" id="f-btn" style="width:100%">寄重設信</button></div>
    <div style="margin-top:8px"><button class="btn ghost" type="button" data-act="forgotBack" style="width:100%">回登入</button></div>
  </form>
  <div id="forgot-sent" class="card hidden" role="status"><h2>信寄出去了</h2><p style="margin:0 0 12px">如果這個 Email 有帳號，幾分鐘內會收到信。沒收到，先看垃圾信件匣；還是沒有，請聯絡育才仕。</p><button class="btn ghost" type="button" data-act="forgotBack" style="width:100%">回登入</button></div>
</div>
<!-- 2026-11-25 第 ① 步：設新密碼頁（重設信裡的連結回來時才顯示；第 ④ 步啟用連結頁共用，標題屆時再換） -->
<div id="resetpw" class="login hidden">
  <h1>NOPQ通</h1>
  <form id="rp-form" class="card" autocomplete="off" novalidate>
    <h2>設新密碼</h2>
    <div id="rp-fields">
      <label class="f" for="rp-new">新密碼</label><input type="password" id="rp-new" autocomplete="new-password">
      <label class="f" for="rp-new2">再輸入一次新密碼</label><input type="password" id="rp-new2" autocomplete="new-password">
      <div id="rp-err" class="err hidden" role="alert"></div>
      <div style="margin-top:14px"><button class="btn" type="submit" id="rp-btn" style="width:100%">設好密碼，進去</button></div>
    </div>
    <div id="rp-bad" class="hidden"><p style="margin:0 0 12px">這個連結已經用過或過期了。</p><button class="btn" type="button" data-act="resetAgain" style="width:100%">再寄一封給我</button></div>
  </form>
</div>
