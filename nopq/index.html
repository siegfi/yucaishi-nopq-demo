<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>NOPQ通｜育才仕</title>
<style>
  :root { --navy:#1f3a5f; --gold:#d99a00; --line:#e1e6ee; --bg:#f5f7fa; --ink:#1d2433; --muted:#667085; --ok:#137333; --warn:#b26a00; --soft:#eef3fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.55; padding-bottom:76px; }
  header { background:var(--navy); color:#fff; padding:14px 16px 12px; }
  header .brand { font-size:13px; opacity:.85; }
  header .hi { font-size:20px; font-weight:700; margin-top:2px; }
  header .season { font-size:13px; margin-top:6px; opacity:.9; }
  main { max-width:560px; margin:0 auto; padding:14px 14px 0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:17px; margin:0 0 10px; }
  .card h3 { font-size:15px; margin:14px 0 6px; }
  .label { display:inline-block; font-size:12px; padding:2px 9px; border-radius:20px; background:var(--soft); color:var(--navy); margin-right:4px; }
  .label.ok { background:#e6f4ea; color:var(--ok); } .label.warn { background:#fff4e0; color:var(--warn); }
  .muted { color:var(--muted); font-size:14px; }
  .big { font-size:18px; font-weight:700; }
  ol.route { margin:8px 0 0; padding-left:22px; } ol.route li { margin:4px 0; }
  .btn { display:inline-block; font:inherit; font-size:15px; padding:10px 16px; border-radius:10px; border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:#fff; color:var(--navy); border-color:var(--line); }
  .btn.small { padding:6px 12px; font-size:14px; }
  .btn:disabled { opacity:.5; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .choices label { border:1px solid var(--line); border-radius:10px; padding:9px 14px; cursor:pointer; background:#fff; font-size:15px; }
  .choices input { margin-right:6px; }
  .choices label:has(input:checked) { border-color:var(--navy); background:var(--soft); }
  .q { margin:16px 0 4px; font-weight:600; }
  input[type=text], input[type=date], textarea { font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  textarea { min-height:70px; }
  .kind { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .kind-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .kind-name { font-weight:700; }
  .kind .hint { font-size:13px; color:var(--muted); margin-top:2px; }
  .kind ul { margin:8px 0 0; padding-left:18px; font-size:14px; } .kind li { margin:2px 0; }
  .kind .add { margin-top:10px; display:grid; gap:8px; }
  .gap { border-left:4px solid var(--line); padding:6px 10px; margin:8px 0; }
  .gap.gap { border-color:var(--warn); } .gap.ok { border-color:var(--ok); } .gap.later, .gap.info { border-color:var(--navy); }
  .gap a { font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); }
  nav.tabs { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 0 calc(6px + env(safe-area-inset-bottom)); z-index:10; }
  nav.tabs button { border:0; background:none; font:inherit; font-size:13px; color:var(--muted); padding:6px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:64px; }
  nav.tabs button .ico { font-size:19px; line-height:1; }
  nav.tabs button.on { color:var(--navy); font-weight:700; }
  .hidden { display:none !important; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:84px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:20; max-width:90vw; }
  .bar { height:8px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:6px; } .bar > div { height:100%; background:var(--navy); }
  .doc-row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .doc-row:last-child { border-bottom:0; }
  .sec { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:10px 0; background:#fff; }
  .sec-head { font-weight:700; font-size:15px; display:flex; justify-content:space-between; gap:8px; }
  .pt { padding:6px 0; border-top:1px dashed var(--line); font-size:15px; }
  .pt:first-of-type { border-top:0; }
  .src { display:inline-block; font-size:12px; color:var(--muted); background:var(--soft); border-radius:6px; padding:1px 6px; margin:2px 4px 0 0; }
  .tmark { font-size:13px; color:var(--warn); }
  .linkbtn { border:0; background:none; color:var(--navy); font:inherit; font-size:13px; cursor:pointer; padding:0 4px; text-decoration:underline; }
  .qcard { border:2px solid var(--navy); border-radius:14px; padding:14px; background:#fff; margin-bottom:14px; }
  .qcard .qtext { font-size:17px; font-weight:700; margin-bottom:8px; }
  .row-btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  mark { background:#fff3b0; padding:0 1px; }
  .snapshot { white-space:pre-wrap; background:var(--soft); border-radius:10px; padding:10px; font-size:15px; }
  details summary { cursor:pointer; color:var(--navy); }
  select { font:inherit; padding:8px; border:1px solid var(--line); border-radius:10px; background:#fff; width:100%; min-width:0; max-width:100%; }
  .add { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; margin-top:8px; }
  .card, .sec, .snapshot { overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <div class="brand">育才仕｜NOPQ通（暫定名）</div>
  <div class="hi" id="hi">載入中…</div>
  <div class="season" id="season"></div>
</header>
<main>
  <div id="notice"></div>

  <!-- 進度 -->
  <section id="view-home">
    <div class="card" id="card-week"></div>
    <div class="card" id="card-start"></div>
    <div class="card" id="card-inv"></div>
    <div class="card" id="card-gaps"></div>
  </section>

  <!-- 起點掃描 -->
  <section id="view-scan" class="hidden">
    <div class="card">
      <h2>起點掃描</h2>
      <p class="muted">花兩分鐘回答幾個問題，系統幫你判斷從哪裡開始。答錯沒關係，之後可以重掃。</p>
      <p id="scan-blocked" class="hidden"><span class="label warn">還不能填</span> 你的同意書還沒登錄完成，請先聯絡老師。</p>
      <div class="q">1. 你有沒有已經寫過的備審文章？（多元表現綜整心得、學習歷程反思、就讀動機、讀書計畫，哪一篇都算）</div>
      <div class="choices">
        <label><input type="radio" name="hasDraft" value="yes">有寫過</label>
        <label><input type="radio" name="hasDraft" value="no">還沒有</label>
      </div>
      <div id="draft-types" class="choices hidden">
        <label><input type="checkbox" value="N">N 多元表現綜整心得</label>
        <label><input type="checkbox" value="O">O 學習歷程反思</label>
        <label><input type="checkbox" value="P">P 就讀動機</label>
        <label><input type="checkbox" value="Q">Q 讀書／未來計畫</label>
      </div>
      <div class="q">2. 學校的學習歷程系統裡，你大概上傳過幾件課程成果或多元表現？</div>
      <div class="choices">
        <label><input type="radio" name="uploads" value="0">0 件／不知道</label>
        <label><input type="radio" name="uploads" value="1-2">1–2 件</label>
        <label><input type="radio" name="uploads" value="3-5">3–5 件</label>
        <label><input type="radio" name="uploads" value="6+">6 件以上</label>
      </div>
      <div class="q">3. 志願定了嗎？</div>
      <div id="wish-state" class="muted"></div>
      <div id="interest-wrap"><input type="text" id="interest" placeholder="還沒定的話，寫下你想念的方向（例：資訊、醫藥、管理）"></div>
      <div id="grade-wrap" class="hidden">
        <div class="q">4. 你現在幾年級？</div>
        <div class="choices">
          <label><input type="radio" name="grade" value="高一">高一</label>
          <label><input type="radio" name="grade" value="高二">高二</label>
          <label><input type="radio" name="grade" value="高三">高三</label>
        </div>
      </div>
      <div class="q"><span id="q5no">4</span>. 想要老師一對一看你的東西嗎？</div>
      <div class="choices">
        <label><input type="radio" name="wants" value="yes">想</label>
        <label><input type="radio" name="wants" value="no">先不用</label>
        <label><input type="radio" name="wants" value="unsure">不確定</label>
      </div>
      <p><button class="btn" id="btn-scan">看我的起點</button></p>
    </div>
  </section>

  <!-- 材料 -->
  <section id="view-inv" class="hidden">
    <div class="card">
      <h2>盤點你做過的事</h2>
      <p class="muted">八類一類一類想：有就按「有」，每件只要寫<b>標題＋一句話</b>；沒有就按「沒有」。要寫得更完整（背景、行動、結果、佐證）可以到<a id="portfolio-link" href="#">學習歷程頁</a>。</p>
      <div class="bar"><div id="inv-bar" style="width:0%"></div></div>
      <p class="muted" id="inv-progress"></p>
    </div>
    <div id="kinds"></div>
  </section>

  <!-- 志願 -->
  <section id="view-wish" class="hidden">
    <div class="card" id="card-req"></div>
  </section>

  <!-- 寫作：清單 → 單篇（大綱對答、改大綱、第一版、老師回饋） -->
  <section id="view-write" class="hidden">
    <div id="write-list"></div>
    <div id="write-doc" class="hidden"></div>
  </section>
</main>

<nav class="tabs">
  <button data-view="home" class="on"><span class="ico">🏠</span>進度</button>
  <button data-view="scan"><span class="ico">🧭</span>起點</button>
  <button data-view="inv"><span class="ico">🗂️</span>材料</button>
  <button data-view="wish"><span class="ico">🎯</span>志願</button>
  <button data-view="write"><span class="ico">✍️</span>寫作</button>
</nav>

<script>
const SUPABASE_URL = 'https://phnulnhmasmyorhmplho.supabase.co'; // 本機平台會自動換成本機網址；上雲時換成正式 URL
const SUPABASE_ANON_KEY = 'sb_publishable_7QYBhi8ypHJ8O_WzFmkwvw_YjM3pmCK';
const TOKEN = new URLSearchParams(location.search).get('t') || '';

const KIND_HINT = {
  courseOutcome: '課堂作業、報告、實驗、作品', competition: '校內外比賽、科展、檢定以外的競賽',
  leadership: '班級幹部、社團幹部、活動總召', volunteer: '服務學習、志工、社區服務',
  campLecture: '營隊、講座、參訪、大學體驗', selfLearning: '自主學習計畫、自學專題',
  certificate: '語言檢定、技能證照、程式檢定', other: '打工、才藝、照顧家人、任何你覺得重要的事',
};
const SCAN_NAME = { hasDraft: '你已經有稿了', hasMaterial: '你有料，還沒寫', blank: '我們從零開始' };
const TRACK_NAME = { bigClass: '跟著大班課走', oneOnOne: '建議找老師一對一' };
const OWNER = { student: '你', teacher: '老師', staff: '育才仕' };
const STAGE = { start: '準備開始', scan: '起點掃描', inventory: '盤點材料', wishlist: '志願與校系', outline: '大綱', draft: '撰寫', review: '修改', export: '匯出', closed: '已完成' };

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let home = null;

function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    // 舊版 anon 金鑰是 JWT（eyJ 開頭）要同時放 Authorization；新版 publishable 金鑰只放 apikey
    method: 'POST', headers: { 'content-type': 'application/json', apikey: SUPABASE_ANON_KEY,
      ...(SUPABASE_ANON_KEY.startsWith('eyJ') ? { authorization: `Bearer ${SUPABASE_ANON_KEY}` } : {}) },
    body: JSON.stringify(args),
  });
  const body = await res.json().catch(() => null);
  if (!res.ok) { const err = new Error(body?.message || `連線錯誤 ${res.status}`); err.server = true; throw err; }  // 有連上、但系統沒接受
  return body;
}
const ERR = { INVALID_TOKEN: '這個連結無效，請跟老師要你的個人連結。', CONSENT_REQUIRED_OR_REVOKED: '你的同意書還沒登錄完成，暫時不能填寫，請聯絡老師。',
  GRADE_REQUIRED: '請選你現在的年級。', GRADE_INVALID: '請選你現在的年級。', ONE_LINE_REQUIRED: '請寫一句話說明這件事。', TITLE_REQUIRED: '請寫標題。',
  HAS_ITEMS: '這一類已經有你寫的紀錄，不能選「沒有」。',
  OUTLINE_LOCKED: '大綱已經送出，等老師看完才能再改。', QUESTION_CHANGED: '題目更新了，請看新的題目。', NO_MORE_QUESTIONS: '題目都答完了。',
  ENTRY_NOT_ALLOWED: '這一題只能勾清單裡的紀錄。', PICK_TOO_MANY: '最多勾 3 件。', ANSWER_REQUIRED: '請寫下你的回答，或按「不確定」「跳過」。',
  SOURCE_REQUIRED: '要點要選一個來源（你的紀錄或你的回答）。', SOURCE_INVALID: '這個來源不能用。', TEXT_INVALID: '要點內容 1–500 字。',
  OUTLINE_INCOMPLETE: '每一段都要有至少一個要點。', DRAFT_UNDER_REVIEW: '老師正在看這一版，看完才能改。', DRAFT_FINALIZED: '這篇已經定稿了。',
  N_TOO_LONG: 'N 超過 800 字（115 學年度規定），刪減後再送。', DRAFT_REQUIRED: '先存一版再送批改。', TEXT_TOO_LONG: '最多 3000 字。',
  TEXT_REQUIRED: '請先寫內容。', WISH_NOT_FOUND: '這個志願不在你的志願清單裡。',
  CASE_REQUIRED: '寫作要報名課程後才開放，請聯絡老師。', OUTLINE_NOT_APPROVED: '大綱老師核可後才能送第一版。',
  DRAFT_LOCKED: '這一版老師正在看或已定稿，不能改。', NOTHING_TO_WITHDRAW: '老師已經開始看了，不能撤回。',
  SESSION_NOT_FOUND: '讀不到這一份，請回清單重新整理。', POINT_NOT_FOUND: '這一點已經不在了，畫面已更新。',
  SECTION_INVALID: '段落不對，請重新整理。', ANSWER_TOO_LONG: '回答最多 2000 字。' };
const SERVER_ERR = '系統沒有接受這次的動作，請重新整理再試；一直不行請告訴老師。';
const errText = (code) => ERR[code] || '沒有存成功，請再試一次；一直不行請告訴老師。';
const NET_ERR = '連不上系統，請確認網路後再試一次。';
const safeUrl = (u) => (/^(https:\/\/|\/(?!\/))/.test(String(u || '')) ? u : null);
// 站內連結（/services/ 這類）改成相對於本頁，網站放在子路徑（如 GitHub Pages）也連得到
const extLink = (u, label) => (safeUrl(u) ? `<a href="${esc(u.startsWith('/') ? '..' + u : u)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : esc(label));

// ── 分頁 ──
function show(view) {
  document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  ['home', 'scan', 'inv', 'wish', 'write'].forEach((v) => $(`view-${v}`).classList.toggle('hidden', v !== view));
  window.scrollTo(0, 0);
  if (view === 'write' && home) loadWriting();
}
document.querySelectorAll('nav.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.view)));

// ── 載入 ──
async function load() {
  if (!TOKEN) { $('hi').textContent = '找不到你的個人連結'; $('notice').innerHTML = `<div class="card">請用老師傳給你的個人連結打開這一頁。</div>`; return; }
  if (SUPABASE_URL.includes('YOUR-PROJECT')) { $('hi').textContent = '預覽版'; $('notice').innerHTML = `<div class="card">這一頁還沒接上資料庫。</div>`; return; }
  try {
    home = await rpc('get_nopq_home', { p_token: TOKEN });
  } catch (e) { $('hi').textContent = '暫時連不上'; $('notice').innerHTML = `<div class="card">${esc(NET_ERR)}</div>`; return; }
  if (!home || !home.ok) { $('hi').textContent = '連結無效'; $('notice').innerHTML = `<div class="card">${esc(errText(home?.error))}</div>`; return; }
  $('portfolio-link').href = `../portfolio/?t=${encodeURIComponent(TOKEN)}`;
  render();
}

function render() {
  const h = home;
  $('hi').textContent = `嗨，${h.student.nickname}`;
  const s = h.season;
  $('season').textContent = `${s.seasonYear} 申請季｜` + (s.daysLeft == null ? '上傳截止日等簡章公告'
    : s.daysLeft < 0 ? '審查資料上傳已截止' : `距審查資料上傳截止約 ${s.daysLeft} 天`);
  $('notice').innerHTML = h.canWrite ? '' : `<div class="card"><span class="label warn">只能看</span> 你的同意書還沒登錄完成，暫時不能填寫。請聯絡老師。</div>`;

  // 這週做一件事
  const c = h.case;
  let week;
  const emptyYes = h.inventory.filter((k) => k.hasAny === true && !k.count).map((k) => k.label);
  const short = h.gaps.filter((g) => g.status === 'gap').map((g) => g.doc);
  if (!h.canWrite) week = { text: '請老師先登錄你的同意書，登錄好就能開始', go: null };
  else if (!h.scan) week = { text: '先做起點掃描（兩分鐘）', go: 'scan' };
  else if (!h.inventoryComplete) week = { text: `把八類材料盤點完（已完成 ${h.inventoryAnswered}／8 類）`, go: 'inv' };
  else if (emptyYes.length) week = { text: `你說「有」的${emptyYes.join('、')}，各加一筆標題＋一句話`, go: 'inv' };
  else if (!h.wishlist.length) week = { text: '確定你的志願', go: 'wish' };
  else if (short.length) week = { text: `八類盤點完了，但 ${short.join('、')} 的素材還不夠：看下面的「缺口」補起來`, go: 'inv' };
  else week = { text: '材料與志願都好了：到「寫作」照順序寫大綱（N → O → P、Q）', go: 'write' };
  // 系統自己填的下一步「這週做一件事」已涵蓋；只顯示老師／育才仕交代給學生的（伺服器只回 owner＝學生的那種）
  const caseNext = c && c.nextAction && c.nextActionBy === 'staff'
    ? `<p class="muted">老師交代：${esc(c.nextAction)}${c.nextActionDue ? `｜期限 ${esc(c.nextActionDue)}` : ''}</p>` : '';
  $('card-week').innerHTML = `<h2>這週做一件事</h2><div class="big">${esc(week.text)}</div>${caseNext}
    ${week.go ? `<p><button class="btn" data-go="${week.go}">去做 →</button></p>` : ''}
    ${c ? `<p class="muted">${esc(c.cohortName || '')}${c.teacherName ? `｜${esc(c.teacherName)}` : ''}｜目前階段：${esc(STAGE[c.stage] || c.stage)}｜${c.track === 'oneOnOne' ? '老師會看你的東西' : '系統檢查＋大班課'}</p>` : ''}`;

  // 起點卡
  if (h.scan) {
    const r = h.scan.result || {};
    const draftHint = h.scan.scanType === 'hasDraft'

  if (rv && rv.status === 'returned') return ['老師回饋了（第一版）', 'warn'];

  if (d.status === 'awaitingReview') return ['等老師看大綱', ''];
  if (d.outlineReturned) return ['老師回饋了（大綱）', 'warn'];
  if (d.draftChars) return ['寫第一版中', ''];
  if (d.status === 'reviewed') return ['大綱老師核可了', 'ok'];

function highlight(text, quotes) {
  const spans = [];
  quotes.filter(Boolean).forEach((qt) => { let i = text.indexOf(qt); while (i >= 0) { spans.push([i, i + qt.length]); i = text.indexOf(qt, i + qt.length); } });
  spans.sort((a, b) => a[0] - b[0]);
  const merged = [];
  spans.forEach(([s, e]) => { const last = merged[merged.length - 1]; if (last && s <= last[1]) last[1] = Math.max(last[1], e); else merged.push([s, e]); });
  let out = '', pos = 0;
  merged.forEach(([s, e]) => { out += esc(text.slice(pos, s)) + `<mark>${esc(text.slice(s, e))}</mark>`; pos = e; });
  return out + esc(text.slice(pos));

      <div class="muted">${n.isFollow ? '再多說一點' : '下一題'}</div><div class="qtext">${esc(n.text)}</div>
      ${n.hintUrl ? `<p>→ ${extLink(n.hintUrl, '看這個系的校系分則')}</p>` : ''}
      ${n.candidates.length ? `<div class="choices">${n.candidates.map((x) => `<label><input type="checkbox" class="cand" value="${esc(x.id)}" ${picked.includes(x.id) ? 'checked' : ''}>${esc(x.title)}</label>`).join('')}</div>` : ''}
      <textarea id="ans" placeholder="寫下你的回答（短短幾句就好）" maxlength="2000">${esc(ansBuf[bk] || '')}</textarea>
      <div class="row-btns"><button class="btn" id="btn-ans">送出</button><button class="btn ghost" id="btn-unsure">不確定</button><button class="btn ghost" id="btn-skip">跳過</button></div></div>`;
  const doneBtn = s.status === 'drafting' && c.canWrite
    ? `<p><button class="btn" id="btn-outline-done" ${c.outline.complete ? '' : 'disabled'}>${s.track === 'oneOnOne' ? '大綱完成，送老師看' : '大綱完成'}</button>
       ${c.outline.complete ? '' : '<span class="muted">每一段都要有至少一點</span>'}</p>` : '';
  const outlineStatus = { drafting: '', outlineDone: '<span class="label ok">大綱完成</span>', awaitingReview: '<span class="label">等老師看大綱</span>',
    reviewed: `<span class="label ok">老師核可了${s.outlineReviewedBy ? `（${esc(s.outlineReviewedBy)}）` : ''}</span>` }[s.status] || '';
  const dr = c.draft, latest = dr.latestReview;
  const big = s.track !== 'oneOnOne';
  let draftNote = '';
  if (latest && latest.status === 'approved') draftNote = '<span class="label ok">已定稿，這一篇不能再改</span>';
  else if (latest && ['waiting', 'inReview'].includes(latest.status)) {
    draftNote = big ? `<span class="label">已送出第 ${latest.round} 份給老師抽樣看</span> <span class="muted">沒抽到不會有回饋。${latest.status === 'inReview'
        ? '老師正在看這一份，看完前不能改。' : '你可以繼續改；一按「存檔」，送出的那份就會收回，改好記得再按「送出給老師抽樣」。'}</span>`
      : `<span class="label">老師批改中，看完才能改</span>${latest.status === 'waiting' ? ' <button class="btn small ghost" id="btn-withdraw">撤回送審</button>' : ''}`;
  }
  const reviews = c.reviews.map((r) => `<div class="sec"><div class="sec-head"><span>第 ${r.round} 次批改｜${esc(r.teacherName || '老師')}</span>
      <span class="label ${r.status === 'approved' ? 'ok' : 'warn'}">${r.status === 'approved' ? '定稿' : '請修改'}${r.readiness ? `｜${READY[r.readiness] || ''}` : ''}</span></div>
      ${r.strengths.length ? `<p><b>寫得好的地方</b></p><ul>${r.strengths.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${r.feedback ? `<p>${esc(r.feedback)}</p>` : ''}
      ${r.comments.length ? `<div class="snapshot">${highlight(r.textSnapshot, r.comments.map((x) => x.quote))}</div>
        <ol>${r.comments.map((x) => `<li><mark>${esc(x.quote)}</mark><br>${esc(x.issue)}${x.question ? `<br><span class="muted">想想看：${esc(x.question)}</span>` : ''}</li>`).join('')}</ol>` : ''}</div>`).join('');
  const draftAdvice = s.status === 'awaitingReview' ? '大綱老師還在看，第一版可以先寫。'
    : ['outlineDone', 'reviewed'].includes(s.status) ? '' : '建議先把大綱完成再寫。';
  $('write-list').classList.add('hidden'); $('write-doc').classList.remove('hidden');
  $('write-doc').innerHTML = `<div class="card"><button class="btn ghost small" id="btn-back">← 回寫作清單</button>
      <h2 style="margin-top:10px">${esc(s.label)}${s.deptName ? `｜${esc(s.deptName)}` : ''}</h2>
      ${s.groupKind === 'rewrite' ? `<p class="muted">這份用「${esc(s.motherDeptName || '你先完成的那份')}」的大綱當母版，只問這個系不一樣的地方；母版的點可以刪或改。</p>` : ''}
      ${writeHeader(s.track)} ${outlineStatus}
      ${s.outlineFeedback ? `<div class="gap gap"><b>老師對大綱的回饋</b><div>${esc(s.outlineFeedback)}</div></div>` : ''}</div>
    ${qcard}
    <div class="card"><h2>大綱</h2>${secs}
      ${c.missingFacts.length ? `<h3>還缺的事實（之後補）</h3><ul>${c.missingFacts.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}${doneBtn}</div>
    <div class="card"><h2>第一版</h2>
      <p class="muted">照著大綱自己寫。${s.nopqType === 'N_diverseSummary' ? 'N 至多 800 字（115 學年度規定，116 以簡章為準；這裡不算空白，實際計法以甄選會為準）。' : '自述沒有統一字數上限，看各系指引；這裡最多 3000 字。'} ${draftAdvice}</p>
      <textarea id="draft" style="min-height:220px" maxlength="3000" ${dr.locked || !c.canWrite ? 'disabled' : ''}>${esc(draftBuf !== null && !dr.locked ? draftBuf : dr.text)}</textarea>
      <p class="muted" id="draft-count"></p><p>${draftNote}</p>
      ${!dr.locked && c.canWrite ? `<div class="row-btns"><button class="btn ghost" id="btn-save-draft">存檔</button><button class="btn" id="btn-submit-draft">${big ? '送出給老師抽樣' : '送批改'}</button></div>` : ''}</div>
    ${reviews ? `<div class="card"><h2>老師回饋</h2>${reviews}</div>` : ''}
    <div class="card"><details><summary>我回答過的題目（${c.turns.length}）</summary>
      <ol>${c.turns.map((t) => `<li><b>${esc(t.question)}</b><br>${t.kind === 'answer' ? esc(t.answer || '（勾選紀錄）') : t.kind === 'unsure' ? '不確定' : '跳過'}
        ${t.section === 'teacher' ? '<span class="muted">（只給老師參考）</span>' : ''}</li>`).join('')}</ol></details></div>`;

  const count = () => {
    const len = nonspace($('draft').value);
    $('draft-count').textContent = `${len} 字（不含空白）` + (s.nopqType === 'N_diverseSummary' && len > 800 ? '｜超過 800 字' : '') + (draftDirty() ? '｜還沒存' : '');
  };
  $('draft').addEventListener('input', () => { draftBuf = $('draft').value; count(); }); count();
  $('btn-back').addEventListener('click', () => {
    if (draftDirty() && !confirm('第一版還有沒存的改動，確定要離開嗎？（離開會丟掉這些改動）')) return;
    cur = null; draftBuf = null; editPoint = null; loadWriting(); renderWritingList();
  });
  if (n && c.canWrite) {
    $('ans').addEventListener('input', () => { ansBuf[bk] = $('ans').value; });
    document.querySelectorAll('.cand').forEach((x) => x.addEventListener('change', () => {
      candBuf[bk] = [...document.querySelectorAll('.cand:checked')].map((y) => y.value);
    }));
    $('btn-ans').addEventListener('click', () => answerTurn(n, bk, 'answer'));
    $('btn-unsure').addEventListener('click', () => answerTurn(n, bk, 'unsure'));
    $('btn-skip').addEventListener('click', () => answerTurn(n, bk, 'skip'));
  }
  $('btn-outline-done')?.addEventListener('click', () => act('submit_outline', { p_token: TOKEN, p_session_id: sid }, s.track === 'oneOnOne' ? '已送老師看大綱' : '大綱完成'));
  $('btn-save-draft')?.addEventListener('click', () => saveDraft('已存檔'));
  $('btn-submit-draft')?.addEventListener('click', async () => {
    if (!(await saveDraft(null))) return;
    act('submit_draft', { p_token: TOKEN, p_session_id: sid }, big ? '已送出，老師抽到會在這裡回饋' : '已送批改');
  });
  $('btn-withdraw')?.addEventListener('click', () => { if (confirm('撤回後老師就看不到這一份，確定？')) act('withdraw_draft', { p_token: TOKEN, p_session_id: sid }, '已撤回，可以繼續改'); });
  document.querySelectorAll('details[data-sec]').forEach((d) => d.addEventListener('toggle', () => {
    const k = `${sid}|${d.dataset.sec}`; pointBuf[k] = { ...(pointBuf[k] || {}), open: d.open };
  }));
  document.querySelectorAll('.np').forEach((x) => x.addEventListener('input', () => {
    const k = `${sid}|${x.dataset.sec}`; pointBuf[k] = { ...(pointBuf[k] || {}), text: x.value, open: true };
  }));
  document.querySelectorAll('.ns').forEach((x) => {
    const pb = pointBuf[`${sid}|${x.dataset.sec}`]; if (pb && pb.ref) x.value = pb.ref;
    x.addEventListener('change', () => { const k = `${sid}|${x.dataset.sec}`; pointBuf[k] = { ...(pointBuf[k] || {}), ref: x.value, open: true }; });
  });
  document.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
    if (confirm('刪掉這一點？')) act('edit_outline_point', { p_token: TOKEN, p_session_id: sid, p: { action: 'delete', pointId: b.dataset.del } }, '已刪除');
  }));
  document.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => { editPoint = b.dataset.edit; renderDoc(); }));
  document.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () => { editPoint = null; renderDoc(); }));
  document.querySelectorAll('[data-save]').forEach((b) => b.addEventListener('click', async () => {
    const text = $(`edit-${b.dataset.save}`).value.trim();
    if (!text) return toast(ERR.TEXT_INVALID);
    if (await act('edit_outline_point', { p_token: TOKEN, p_session_id: sid, p: { action: 'update', pointId: b.dataset.save, text } }, '已修改')) { editPoint = null; renderDoc(); }
  }));
  document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', async () => {
    const sec = b.dataset.add, k = `${sid}|${sec}`;
    const text = document.querySelector(`.np[data-sec="${sec}"]`).value.trim(), ref = document.querySelector(`.ns[data-sec="${sec}"]`).value;
    if (!text) return toast('請寫要點');
    if (!ref) return toast(ERR.SOURCE_REQUIRED);
    if (await act('edit_outline_point', { p_token: TOKEN, p_session_id: sid, p: { action: 'add', section: sec, text, sourceRefs: [{ ref }] } }, '已加入')) {
      delete pointBuf[k]; renderDoc();
    }
  }));
}
// 送出、存檔類動作：成功就換成伺服器回傳的最新內容；失敗跳中文訊息，並重抓一次伺服器狀態，不讓畫面停在舊的
async function act(fn, args, okText) {
  if (busy) return false;
  busy = true;
  document.querySelectorAll('#write-doc button').forEach((b) => { b.disabled = true; });
  let ok = false;
  try {
    const r = await rpc(fn, args);
    if (r && r.session) PAYLOAD_KEYS.forEach((k) => { if (k in r) cur[k] = r[k]; });
    if (!r || !r.ok) {
      toast(r?.error === 'OUTLINE_LOCKED' && cur.session.status === 'reviewed' ? '老師已經核可這份大綱，不能再改。' : errText(r?.error));
      if (!r || !r.session) await refreshCur();
      return false;
    }
    if (fn === 'answer_outline_turn') { const k = `${cur.session.id}|${args.p.key}`; delete ansBuf[k]; delete candBuf[k]; }
    if (okText) toast(okText);
    ok = true;
    return true;
  } catch (e) {
    toast(e.server ? SERVER_ERR : NET_ERR);
    await refreshCur();
    return false;
  } finally { busy = false; if (!ok || fn !== 'save_draft') renderDoc(); }
}
async function refreshCur() {
  try {
    const s = await rpc('get_outline_session', { p_token: TOKEN, p_session_id: cur.session.id });
    if (s && s.ok) PAYLOAD_KEYS.forEach((k) => { if (k in s) cur[k] = s[k]; });
  } catch { /* 連不上就維持原畫面 */ }
}
async function saveDraft(okText) {
  const sent = $('draft').value;
  const ok = await act('save_draft', { p_token: TOKEN, p_session_id: cur.session.id, p: { text: sent } }, okText);
  if (ok && draftBuf === sent) draftBuf = null;  // 存檔途中又打的字保留在 draftBuf
  renderDoc();
  return ok;
}
async function answerTurn(n, bk, kind) {
  const answer = $('ans').value.trim();
  const entryIds = [...document.querySelectorAll('.cand:checked')].map((x) => x.value);
  if (kind === 'answer' && !answer && !entryIds.length) return toast(ERR.ANSWER_REQUIRED);
  if (n.pick === 'diverse' && entryIds.length > 3) return toast(ERR.PICK_TOO_MANY);
  ansBuf[bk] = $('ans').value; candBuf[bk] = entryIds;
  const ok = await act('answer_outline_turn', { p_token: TOKEN, p_session_id: cur.session.id,
    p: { key: n.key, kind, answer: kind === 'answer' ? answer : null, entryIds: kind === 'answer' ? entryIds : [], clientRequestId: qReq[bk] } }, null);
  if (ok) document.querySelector('.qcard')?.scrollIntoView({ block: 'start' });
}

load();
</script>
</body>
</html>
